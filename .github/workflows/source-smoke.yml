name: Source smoke
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'api/**'
      - 'scripts/source-smoke.js'
      - 'scripts/product-smoke.js'
      - '.github/workflows/source-smoke.yml'
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify source endpoints
        run: node scripts/source-smoke.js
      - name: Exercise live finder end to end
        run: node scripts/product-smoke.js
